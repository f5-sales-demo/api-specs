---
name: Tests

# Nothing ran the Python suite in CI before this workflow (#681). That is why a stale
# release/specs could sit on main for three weeks with every check green: the tests that
# would have noticed were only ever run locally, if at all.
#
# The suite is offline by design -- no network, no F5XC_API_TOKEN. The single live-API test
# skips itself when the token is absent, so this is safe on forks and on the schedule.
#
# NOTE: this context is not yet in branch protection's required checks. Those are applied by
# docs-control's enforce-repo-settings.yml via repo_overrides[<repo>].additional_contexts, so
# making it blocking is a change in that repository, not this one. Until that lands this
# workflow reports but cannot block.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11.13'
  UV_VERSION: '0.12.1'

jobs:
  pytest:
    name: Python test suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked test environment
        run: |
          uv sync --frozen --extra dev

      - name: Run tests
        run: uv run --frozen pytest -q
