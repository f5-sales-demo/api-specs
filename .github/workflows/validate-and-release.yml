---
name: Validate and Release

on:
  schedule:
    # Run daily at 6 AM UTC
    - cron: '0 6 * * *'
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'config/**'
      - 'pyproject.toml'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force release even if no changes detected'
        type: boolean
        default: false
      skip_live_tests:
        description: 'Skip live API tests (dry run)'
        type: boolean
        default: false

# Read-only default; jobs that write declare their own scope: `validate` needs
# issues: write (it syncs discrepancy issues), `failure-tracker` needs
# issues: write (it opens, updates and closes the pipeline-failure issue), and
# `release` needs contents: write (it creates the tag and release).
permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Specs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    outputs:
      specs_changed: ${{ steps.check_specs.outputs.changed }}
      specs_etag: ${{ steps.check_specs.outputs.etag }}
      content_hash: ${{ steps.content_hash.outputs.hash }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for tags

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js (for Spectral)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Spectral
        run: npm install -g @stoplight/spectral-cli

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Get previous ETag from cache
        id: prev_etag
        uses: actions/cache@v4
        with:
          path: .etag_cache
          key: etag-${{ github.sha }}
          restore-keys: |
            etag-

      - name: Check upstream specs for changes
        id: check_specs
        run: |
          # Store previous ETag if exists
          PREV_ETAG=""
          if [ -f .etag_cache ]; then
            PREV_ETAG=$(cat .etag_cache)
            echo "Previous ETag: ${PREV_ETAG}"
          fi

          # Download specs (will use ETag for conditional GET)
          python -m scripts.download --list

          # Get new ETag
          NEW_ETAG=""
          if [ -f .etag_cache ]; then
            NEW_ETAG=$(cat .etag_cache)
            echo "Current ETag: ${NEW_ETAG}"
          fi

          # Compare ETags to detect change
          if [ "${PREV_ETAG}" != "${NEW_ETAG}" ] || [ -z "${PREV_ETAG}" ]; then
            echo "Upstream specs have changed"
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "Upstream specs unchanged"
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          fi

          echo "etag=${NEW_ETAG}" >> "${GITHUB_OUTPUT}"

      - name: Transform specs to compliant OAS3
        run: |
          echo "Running OAS3 transform pipeline..."
          python -m scripts.transform
          echo "Transformed specs written to specs/transformed/"

      - name: Validate specs (dry run)
        if: inputs.skip_live_tests == true
        run: |
          python -m scripts.validate --dry-run

      - name: Validate specs (live)
        if: inputs.skip_live_tests != true
        env:
          F5XC_API_URL: ${{ secrets.F5XC_API_URL }}
          F5XC_API_TOKEN: ${{ secrets.F5XC_API_TOKEN }}
        run: |
          if [ -z "${F5XC_API_TOKEN}" ]; then
            echo "::warning::F5XC_API_TOKEN not set, running in dry-run mode"
            python -m scripts.validate --dry-run
          else
            python -m scripts.validate || true
          fi

      - name: Run Spectral OAS3 linting
        run: |
          echo "Running Spectral analysis on downloaded specs..."
          python -m scripts.spectral_lint --mode discover
          echo "Spectral report saved to reports/spectral_report.json"

      - name: Reconcile specs and apply fixes
        run: |
          echo "Reconciling specs based on validation and Spectral results..."
          python -m scripts.reconcile --report reports/validation_report.json reports/spectral_report.json
          echo "Fix report saved to reports/fixes_applied.json"

      - name: Sync discrepancies to GitHub issues
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          F5XC_API_URL: ${{ secrets.F5XC_API_URL }}
          F5XC_API_TOKEN: ${{ secrets.F5XC_API_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python -m scripts.issue_sync \
            --report reports/validation_report.json \
            --mapping-out reports/issue_mapping.json \
            --config config/issue_sync.yaml \
            --run-url "$RUN_URL"

      - name: Sync discrepancies (dry-run on PR)
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          F5XC_API_URL: ${{ secrets.F5XC_API_URL }}
          F5XC_API_TOKEN: ${{ secrets.F5XC_API_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python -m scripts.issue_sync \
            --report reports/validation_report.json \
            --mapping-out reports/issue_mapping.json \
            --config config/issue_sync.yaml \
            --dry-run \
            --run-url "$RUN_URL"

      - name: Upload issue mapping artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-mapping
          path: reports/issue_mapping.json
          retention-days: 30

      - name: Spectral quality gate
        run: |
          echo "Running Spectral quality gate on reconciled specs..."
          python -m scripts.spectral_lint --mode gate
          echo "Gate report saved to reports/spectral_gate_report.json"

      - name: Calculate content hash
        id: content_hash
        run: |
          # Create deterministic hash of reconciled specs content
          HASH=$(find release/specs -type f -name "*.json" -exec sha256sum {} \; | sort | sha256sum | cut -d' ' -f1)
          echo "Reconciled specs hash: ${HASH}"
          echo "hash=${HASH}" >> "${GITHUB_OUTPUT}"

      - name: Upload validation reports
        # Always: the Spectral gate above is the step most likely to fail, and
        # its report is the only place the offending rule and file are
        # recorded in full.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: reports/
          retention-days: 30

      - name: Upload reconciled specs
        uses: actions/upload-artifact@v4
        with:
          name: reconciled-specs
          path: release/specs/
          retention-days: 7

      - name: Upload spec metadata
        uses: actions/upload-artifact@v4
        with:
          name: spec-metadata
          path: specs/original/.spec_metadata.json
          retention-days: 7
          include-hidden-files: true

  check-release-needed:
    name: Check if Release Needed
    needs: validate
    runs-on: ubuntu-latest
    # Only reads: `gh release view` to recover the previous content hash.
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download spec metadata
        uses: actions/download-artifact@v8
        with:
          name: spec-metadata
          path: specs/original/

      - name: Get previous release hash
        id: prev_hash
        run: |
          # Get the content hash from the most recent release tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "${LATEST_TAG}" ]; then
            # Check if release notes contain the hash
            PREV_HASH=$(gh release view "${LATEST_TAG}" --json body -q '.body' | grep -oP 'Content Hash: \K[a-f0-9]+' || echo "")
            echo "Previous release hash: ${PREV_HASH}"
            echo "hash=${PREV_HASH}" >> "${GITHUB_OUTPUT}"
          else
            echo "No previous release found"
            echo "hash=" >> "${GITHUB_OUTPUT}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version from metadata
        id: version
        run: |
          # Read spec_date from metadata
          if [ -f specs/original/.spec_metadata.json ]; then
            SPEC_DATE=$(python3 -c "import json; print(json.load(open('specs/original/.spec_metadata.json')).get('spec_date', ''))")
          else
            SPEC_DATE=$(date -u +"%Y.%m.%d")
          fi

          # Find next patch number for this spec date
          PATCH=1
          while git rev-parse "v${SPEC_DATE}-${PATCH}" >/dev/null 2>&1; do
            PATCH=$((PATCH + 1))
          done

          VERSION="${SPEC_DATE}-${PATCH}"
          echo "Version: ${VERSION}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Check if release is needed
        id: check
        env:
          SPECS_CHANGED: ${{ needs.validate.outputs.specs_changed }}
          CURRENT_HASH: ${{ needs.validate.outputs.content_hash }}
          PREV_HASH: ${{ steps.prev_hash.outputs.hash }}
          FORCE: ${{ inputs.force_release }}
        run: |
          echo "Specs changed: ${SPECS_CHANGED}"
          echo "Current hash: ${CURRENT_HASH}"
          echo "Previous hash: ${PREV_HASH}"
          echo "Force release: ${FORCE}"

          if [ "${FORCE}" = "true" ]; then
            echo "Force release requested"
            echo "should_release=true" >> "${GITHUB_OUTPUT}"
          elif [ "${SPECS_CHANGED}" = "true" ]; then
            echo "Upstream specs changed - release needed"
            echo "should_release=true" >> "${GITHUB_OUTPUT}"
          elif [ -z "${PREV_HASH}" ]; then
            echo "No previous release found - release needed"
            echo "should_release=true" >> "${GITHUB_OUTPUT}"
          elif [ "${CURRENT_HASH}" != "${PREV_HASH}" ]; then
            echo "Content hash changed (code changes affected output) - release needed"
            echo "should_release=true" >> "${GITHUB_OUTPUT}"
          else
            echo "No changes detected - skipping release"
            echo "should_release=false" >> "${GITHUB_OUTPUT}"
          fi

  release:
    name: Create Release
    needs: [validate, check-release-needed]
    if: needs.check-release-needed.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Discard committed specs before extracting the artifact
        run: |
          # release/specs is committed but is a build product. Upstream
          # filenames embed a sequence index that shifts when F5 adds or
          # removes a domain, so checked-out specs the current run does not
          # overwrite would otherwise be packaged into the release.
          rm -rf release/specs
          mkdir -p release/specs

      - name: Download reconciled specs
        uses: actions/download-artifact@v8
        with:
          name: reconciled-specs
          path: release/specs/

      - name: Download validation reports
        uses: actions/download-artifact@v8
        with:
          name: validation-reports
          path: reports/

      - name: Download spec metadata
        uses: actions/download-artifact@v8
        with:
          name: spec-metadata
          path: specs/original/

      - name: Build release package
        env:
          VERSION: ${{ needs.check-release-needed.outputs.version }}
        run: |
          python -m scripts.release --version "${VERSION}"

      - name: Generate release notes
        id: release_notes
        env:
          VERSION: ${{ needs.check-release-needed.outputs.version }}
          CONTENT_HASH: ${{ needs.validate.outputs.content_hash }}
          SPECS_CHANGED: ${{ needs.validate.outputs.specs_changed }}
          SPECS_ETAG: ${{ needs.validate.outputs.specs_etag }}
          REPOSITORY: ${{ github.repository }}
        run: |

          cat > release_notes.md << EOF
          ## F5 XC API Specs v${VERSION}

          ### Changes
          EOF

          if [ "${SPECS_CHANGED}" = "true" ]; then
            echo "- Upstream F5 XC specs updated" >> release_notes.md
          else
            echo "- Code changes resulted in updated output" >> release_notes.md
          fi

          cat >> release_notes.md << EOF

          ### Validation
          - OpenAPI Spec Validator: ✅
          - Schemathesis property-based testing
          - Custom constraint validation

          ### Contents
          - \`openapi.json\` - Merged OpenAPI specification
          - \`openapi.yaml\` - YAML format
          - \`domains/\` - Individual domain spec files
          - \`CHANGELOG.md\` - List of fixes applied
          - \`VALIDATION_REPORT.md\` - Validation summary

          ### Metadata
          - Content Hash: ${CONTENT_HASH}
          - Specs ETag: ${SPECS_ETAG}

          ---
          🤖 Generated by [F5 XC API Validation Framework](https://github.com/${REPOSITORY})
          EOF

          cat release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check-release-needed.outputs.version }}
        run: |
          gh release create \
            "v${VERSION}" \
            "release/api-specs-v${VERSION}.zip" \
            --title "F5 XC API Specs v${VERSION}" \
            --notes-file release_notes.md

      - name: Summary
        env:
          VERSION: ${{ needs.check-release-needed.outputs.version }}
          CONTENT_HASH: ${{ needs.validate.outputs.content_hash }}
        run: |
          {
            echo "### Release Created 🎉"
            echo ""
            echo "**Version**: v${VERSION}"
            echo "**Content Hash**: ${CONTENT_HASH}"
          } >> "${GITHUB_STEP_SUMMARY}"

  skip-release:
    name: Skip Release (No Changes)
    needs: [validate, check-release-needed]
    if: needs.check-release-needed.outputs.should_release == 'false'
    runs-on: ubuntu-latest
    # Writes only to the step summary.
    permissions:
      contents: read

    steps:
      - name: Summary
        env:
          SPECS_CHANGED: ${{ needs.validate.outputs.specs_changed }}
          CONTENT_HASH: ${{ needs.validate.outputs.content_hash }}
        run: |
          {
            echo "### No Release Needed ⏭️"
            echo ""
            echo "No changes detected in upstream specs or generated output."
            echo ""
            echo "**Specs Changed**: ${SPECS_CHANGED}"
            echo "**Content Hash**: ${CONTENT_HASH}"
          } >> "${GITHUB_STEP_SUMMARY}"

  failure-tracker:
    name: Failure Tracker
    needs: [validate, check-release-needed, release]
    # Runs on success too, so the tracker it opens is also the thing that
    # closes it. `release` is skipped when there is nothing to publish, which
    # is not a failure.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Opens, updates or closes the single pipeline-failure tracking issue.
    permissions:
      contents: read
      issues: write

    steps:
      - name: Reconcile the failure tracker with this run
        uses: actions/github-script@v8
        env:
          PIPELINE_FAILED: ${{ contains(needs.*.result, 'failure') }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          CHECK_RESULT: ${{ needs.check-release-needed.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
        with:
          script: |
            // One tracker, not one issue per run. The previous version opened
            // a dated issue on every failure: thirteen consecutive runs
            // produced thirteen near-identical issues, none of which named a
            // cause, so a two-week outage read as routine noise. A single
            // issue that accumulates occurrences -- and closes itself when a
            // run succeeds -- is the signal.
            const marker = '<!-- validate-and-release-failure-tracker -->';
            const failed = process.env.PIPELINE_FAILED === 'true';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/` +
              `${context.repo.repo}/actions/runs/${context.runId}`;

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'automation',
              per_page: 100,
            });
            const tracker = open.find((issue) => (issue.body || '').includes(marker));

            if (!failed) {
              if (tracker) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: tracker.number,
                  body: `Recovered: ${runUrl}`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: tracker.number,
                  state: 'closed',
                  state_reason: 'completed',
                });
                core.notice(`Pipeline recovered; closed #${tracker.number}`);
              }
              return;
            }

            const occurrence = [
              `**Run**: ${runUrl}`,
              `**Trigger**: ${context.eventName}`,
              `**Date**: ${new Date().toISOString().split('T')[0]}`,
              '',
              '| Job | Result |',
              '| --- | --- |',
              `| Validate | ${process.env.VALIDATE_RESULT} |`,
              `| Check Release | ${process.env.CHECK_RESULT} |`,
              `| Release | ${process.env.RELEASE_RESULT} |`,
              '',
              'The failing step names the cause in its own log; the full',
              'Spectral gate report is in the `validation-reports` artifact.',
            ].join('\n');

            if (tracker) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: tracker.number,
                body: `Still failing.\n\n${occurrence}`,
              });
              core.notice(`Still failing; see #${tracker.number}`);
              return;
            }

            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Validate and Release is failing',
              body: [
                marker,
                '## Validate and Release is failing',
                '',
                'No release artifact publishes while this is red, which',
                'strands every downstream consumer. This issue collects each',
                'further occurrence and closes itself when a run succeeds.',
                '',
                occurrence,
              ].join('\n'),
              labels: ['automation', 'bug'],
            });
            core.notice(`Pipeline failed; opened #${created.data.number}`);

  update-docs:
    name: Update Documentation
    needs: [validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_ADMIN_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Download validation reports
        uses: actions/download-artifact@v8
        with:
          name: validation-reports
          path: reports/

      - name: Generate documentation
        run: |
          python scripts/generate_docs.py \
            --validation-report reports/validation_report.json \
            --fix-report reports/fixes_applied.json \
            --output docs/01-validation-report.mdx

      - name: Commit and PR if changed
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No docs changes"
            exit 0
          fi
          BRANCH="docs/update-validation-report-$(date +%s)"
          git checkout -b "${BRANCH}"
          git commit -m "docs: update validation report"
          git push origin "${BRANCH}"
          gh pr create --title "docs: update validation report" \
            --body "Auto-generated from validation pipeline run."
          gh pr merge --auto --squash
