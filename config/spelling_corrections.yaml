---
# Spelling corrections for prose fields in the F5 XC OpenAPI specs.
# Applied by the fix_spelling transform during `make transform`.
#
# Source: codespell audit of 268 released specs (2026-06-09).
# Each entry maps a misspelled word to its correction.
# Corrections are case-sensitive and applied as whole-word replacements
# within JSON string values only.
#
# SAFETY -- prose only, never identifiers.
# A correction must never alter a property name, an enum value, or any other
# identifier: `blocked_sevice` and `checkin` are real F5 XC wire keys, and a
# blind text replacement that "fixes" them breaks the API contract. Two
# mechanisms enforce this:
#   1. text_fields below restricts replacement to human-readable prose. Data
#      fields (notably x-ves-example, whose values are wire values such as
#      "Operational", "ns1" or a label selector) are deliberately excluded.
#   2. tests/test_spelling_corrections.py fails if any key below matches a
#      property name, a required entry, an enum value or a parameter name in
#      the published specs.
# Before adding a key, confirm it cannot appear as an identifier.

# JSON keys whose string values are prose and may be spell-corrected.
# Keep in sync with the guard test -- both read this list.
text_fields:
  - description
  - summary
  - title
  - x-displayname

corrections:
  # --- High frequency (>= 10 occurrences) ---
  referrred: referred
  Validtion: Validation
  succeded: succeeded
  Neworks: Networks
  conects: connects
  expresssions: expressions
  Nework: Network
  nework: network

  # --- Medium frequency (2-9 occurrences) ---
  Addresss: Address
  addres: address
  addresse: addresses
  addressses: addresses
  Assciations: Associations
  assocaited: associated
  assosciation: association
  Avarage: Average
  bellow: below
  Cahce: Cache
  cahce: cache
  Certficate: Certificate
  configuation: configuration
  configurred: configured
  contol: control
  detination: destination
  domian: domain
  emtpy: empty
  formating: formatting
  Maximun: Maximum
  namesapce: namespace
  positve: positive
  prefered: preferred
  Refernce: Reference
  refering: referring
  reponse: response
  Reponse: Response
  resturn: return
  senstive: sensitive
  Serice: Service
  Souce: Source
  Subsciption: Subscription
  sucess: success
  uprade: upgrade
  verfication: verification
  withing: within
  accociated: associated
  condigures: configures
  programed: programmed

  # --- Low frequency (1 occurrence) ---
  acccess: access
  assgined: assigned
  assigments: assignments
  assingned: assigned
  assesment: assessment
  Attachements: Attachments
  avaialable: available
  Availble: Available
  celcius: celsius
  cerificates: certificates
  Chanel: Channel
  choise: choice
  cna: can
  Colletor: Collector
  Connnect: Connect
  contails: contains
  Creadential: Credential
  DECOMISSIONING: DECOMMISSIONING
  deinition: definition
  dependant: dependent
  Dignosis: Diagnosis
  enviroment: environment
  exising: existing
  fileystem: filesystem
  fo: for
  followig: following
  idenfify: identify
  inclusing: including
  indentified: identified
  infomation: information
  Insatnce: Instance
  intiated: initiated
  managment: management
  Manangement: Management
  mechanims: mechanisms
  multple: multiple
  Newtork: Network
  oberved: observed
  objec: object
  paramters: parameters
  Probablity: Probability
  procotol: protocol
  Referesh: Refresh
  repesents: represents
  Resurce: Resource
  Reture: Return
  secuirty: security
  segemnts: segments
  separte: separate
  Sesions: Sessions
  specificed: specified
