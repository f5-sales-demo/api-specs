---
# Governed caller for the Antigravity Gemini Language Translator. Synced by docs-control managed-files
# to opted-in repositories.
# Invokes the shared reusable translator in docs-control at a commit-pinned SHA.
name: Antigravity Language Translation
on:
  pull_request:
    paths:
      - "docs/en/**"
      - "src/content/docs/en/**"
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  translate:
    # SUSPENDED: Gemini Antigravity translation shares the fleet translation
    # switch while its quota is exhausted.
    # Runs only if explicitly enabled, the PR head repository is the same as the
    # base repository, and the event is not triggered on an automated branch.
    if: >-
      vars.TRANSLATIONS_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      !(startsWith(github.head_ref, 'governance/') ||
        startsWith(github.head_ref, 'sync/') ||
        startsWith(github.head_ref, 'release/') ||
        startsWith(github.head_ref, 'openapi-sync/') ||
        startsWith(github.head_ref, 'plugin-sync/') ||
        startsWith(github.head_ref, 'deps/') ||
        startsWith(github.head_ref, 'docs/update-') ||
        startsWith(github.head_ref, 'auto-regenerate/') ||
        startsWith(github.head_ref, 'auto-generate/') ||
        startsWith(github.head_ref, 'autoresearch/') ||
        (startsWith(github.head_ref, 'dependabot/') && github.event.pull_request.user.id == 49699333))
    uses: f5-sales-demo/docs-control/.github/workflows/antigravity-translate.yml@94a0cb518b88f717e7b452a714fe7f97a00d0bbb
    permissions:
      contents: write # commit generated translations to the same-repository branch
      pull-requests: write # update the translated pull request
      issues: write # report translation failures through GitHub issue surfaces
    secrets:
      ANTIGRAVITY_TOKEN: ${{ secrets.ANTIGRAVITY_TOKEN }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
