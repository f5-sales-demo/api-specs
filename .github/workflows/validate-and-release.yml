---
name: Validate and Release

on:
  schedule:
    # Run daily at 6 AM UTC
    - cron: '0 6 * * *'
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'config/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - '.github/workflows/validate-and-release.yml'
  workflow_dispatch: {}

# Read-only default; jobs that write declare their own scope: `validate` needs
# issues: write (it syncs discrepancy issues), `failure-tracker` needs
# issues: write (it opens, updates and closes the pipeline-failure issue), and
# `release` needs contents: write (it creates the tag and release).
permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11.13'
  NODE_VERSION: '20.19.5'
  UV_VERSION: '0.12.1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Specs
    runs-on: ubuntu-latest
    permissions:
      contents: read # Checks out the exact source and tag history used as validation inputs.
      issues: write # Synchronizes measured live discrepancies to their tracker issues.
    outputs:
      specs_changed: ${{ steps.check_specs.outputs.changed }}
      specs_etag: ${{ steps.check_specs.outputs.etag }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # Need full history for tags

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js (for Spectral)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Now that a lockfile exists, setup-node can key the npm cache off it.
          cache: npm

      - name: Install Spectral
        # From the lockfile, not an ad-hoc global install. A floating `npm install -g` made the
        # Spectral gate's verdict depend on whatever npm resolved that morning, so an upstream
        # rule change could turn the pipeline red with no commit behind it -- and it is what
        # zizmor's adhoc-packages audit flags, which had the pre-commit hook failing on an
        # untouched main.
        #
        # --ignore-scripts because Spectral needs no build step, and the tree pulls in
        # @scarf/scarf, whose postinstall phones home. scripts/spectral_lint.py resolves the
        # binary with shutil.which("spectral"), so node_modules/.bin must be on PATH.
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
          echo "${GITHUB_WORKSPACE}/node_modules/.bin" >> "${GITHUB_PATH}"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked environment
        run: |
          uv sync --frozen

      - name: Get previous ETag from cache
        id: prev_etag
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .etag_cache
          key: etag-${{ github.sha }}
          restore-keys: |
            etag-

      - name: Check upstream specs for changes
        id: check_specs
        run: |
          # Store previous ETag if exists
          PREV_ETAG=""
          if [ -f .etag_cache ]; then
            PREV_ETAG=$(cat .etag_cache)
            echo "Previous ETag: ${PREV_ETAG}"
          fi

          # Download specs (will use ETag for conditional GET)
          uv run --frozen python -m scripts.download --list

          # Get new ETag
          NEW_ETAG=""
          if [ -f .etag_cache ]; then
            NEW_ETAG=$(cat .etag_cache)
            echo "Current ETag: ${NEW_ETAG}"
          fi

          # Compare ETags to detect change
          if [ "${PREV_ETAG}" != "${NEW_ETAG}" ] || [ -z "${PREV_ETAG}" ]; then
            echo "Upstream specs have changed"
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "Upstream specs unchanged"
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          fi

          echo "etag=${NEW_ETAG}" >> "${GITHUB_OUTPUT}"

      - name: Transform specs to compliant OAS3
        run: |
          echo "Running OAS3 transform pipeline..."
          uv run --frozen python -m scripts.transform
          echo "Transformed specs written to specs/transformed/"

      - name: Validate specs (live)
        env:
          F5XC_API_URL: ${{ secrets.F5XC_API_URL }}
          F5XC_API_TOKEN: ${{ secrets.F5XC_API_TOKEN }}
          F5XC_NAMESPACE: ${{ secrets.F5XC_NAMESPACE }}
        run: |
          : "${F5XC_API_URL:?F5XC_API_URL is required for live validation}"
          : "${F5XC_API_TOKEN:?F5XC_API_TOKEN is required for live validation}"
          : "${F5XC_NAMESPACE:?F5XC_NAMESPACE is required for live validation}"
          uv run --frozen python -m scripts.validate

      - name: Run Spectral OAS3 linting
        run: |
          echo "Running Spectral analysis on downloaded specs..."
          uv run --frozen python -m scripts.spectral_lint --mode discover
          echo "Spectral report saved to reports/spectral_report.json"

      - name: Reconcile specs and apply fixes
        run: |
          echo "Reconciling specs based on validation and Spectral results..."
          uv run --frozen python -m scripts.reconcile \
            --report reports/validation_report.json reports/spectral_report.json
          echo "Fix report saved to reports/fixes_applied.json"

      - name: Sync discrepancies to GitHub issues
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          F5XC_API_URL: ${{ secrets.F5XC_API_URL }}
          F5XC_API_TOKEN: ${{ secrets.F5XC_API_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          uv run --frozen python -m scripts.issue_sync \
            --report reports/validation_report.json \
            --mapping-out reports/issue_mapping.json \
            --config config/issue_sync.yaml \
            --run-url "$RUN_URL"

      - name: Sync discrepancies (dry-run on PR)
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          F5XC_API_URL: ${{ secrets.F5XC_API_URL }}
          F5XC_API_TOKEN: ${{ secrets.F5XC_API_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          uv run --frozen python -m scripts.issue_sync \
            --report reports/validation_report.json \
            --mapping-out reports/issue_mapping.json \
            --config config/issue_sync.yaml \
            --dry-run \
            --run-url "$RUN_URL"

      - name: Upload issue mapping artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: issue-mapping
          path: reports/issue_mapping.json
          retention-days: 30

      - name: Spectral quality gate
        run: |
          echo "Running Spectral quality gate on reconciled specs..."
          uv run --frozen python -m scripts.spectral_lint --mode gate
          echo "Gate report saved to reports/spectral_gate_report.json"

      - name: Upload validation reports
        # Always: the Spectral gate above is the step most likely to fail, and
        # its report is the only place the offending rule and file are
        # recorded in full.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-reports
          path: reports/
          retention-days: 30

      - name: Upload reconciled specs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reconciled-specs
          path: release/specs/
          retention-days: 7

      - name: Upload spec metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spec-metadata
          path: specs/original/.spec_metadata.json
          retention-days: 7
          include-hidden-files: true

  release-metadata:
    name: Determine Release Metadata
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_timestamp: ${{ steps.version.outputs.build_timestamp }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked environment
        run: |
          uv sync --frozen

      - name: Download spec metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: spec-metadata
          path: specs/original/

      - name: Determine version from metadata
        id: version
        run: |
          IFS=$'\t' read -r SPEC_DATE BUILD_TIMESTAMP < <(python - <<'PY'
          from datetime import UTC, datetime
          import json
          import re
          from pathlib import Path

          path = Path("specs/original/.spec_metadata.json")
          document = json.loads(path.read_text())
          spec_date = document.get("spec_date")
          if not isinstance(spec_date, str) or re.fullmatch(r"[0-9]{4}\.[0-9]{2}\.[0-9]{2}", spec_date) is None:
              raise ValueError("spec metadata requires YYYY.MM.DD spec_date")
          spec_timestamp = document.get("spec_timestamp")
          if not isinstance(spec_timestamp, str):
              raise ValueError("spec metadata requires spec_timestamp")
          try:
              parsed_timestamp = datetime.fromisoformat(spec_timestamp.replace("Z", "+00:00"))
          except ValueError as exc:
              raise ValueError("spec metadata spec_timestamp must be ISO 8601") from exc
          if parsed_timestamp.tzinfo is None or parsed_timestamp.utcoffset() is None:
              raise ValueError("spec metadata spec_timestamp requires a UTC offset")
          parsed_timestamp = parsed_timestamp.astimezone(UTC)
          if parsed_timestamp.strftime("%Y.%m.%d") != spec_date:
              raise ValueError("spec_date and spec_timestamp identify different dates")
          print(f"{spec_date}\t{parsed_timestamp.isoformat()}")
          PY
          )

          # Find next patch number for this spec date
          PATCH=1
          while git rev-parse "v${SPEC_DATE}-${PATCH}" >/dev/null 2>&1; do
            PATCH=$((PATCH + 1))
          done

          VERSION="${SPEC_DATE}-${PATCH}"
          echo "Version: ${VERSION}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "build_timestamp=${BUILD_TIMESTAMP}" >> "${GITHUB_OUTPUT}"

  build-release-candidate:
    name: Build Release Candidate (${{ matrix.candidate }})
    needs: [validate, release-metadata]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        candidate: [one, two]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked environment
        run: |
          uv sync --frozen

      - name: Discard committed candidate inputs
        run: |
          rm -rf release/specs reports
          mkdir -p release/specs reports

      - name: Download reconciled specs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: reconciled-specs
          path: release/specs/

      - name: Download validation reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: validation-reports
          path: reports/

      - name: Build release candidate
        env:
          VERSION: ${{ needs.release-metadata.outputs.version }}
          BUILD_TIMESTAMP: ${{ needs.release-metadata.outputs.build_timestamp }}
        run: |
          uv run --isolated --frozen python -m scripts.release \
            --output-dir release/candidate \
            --version "${VERSION}" \
            --build-timestamp "${BUILD_TIMESTAMP}"

      - name: Upload release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-${{ matrix.candidate }}
          path: release/candidate/api-specs-v${{ needs.release-metadata.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 7

  check-release-needed:
    name: Check if Release Needed
    needs: [validate, release-metadata, build-release-candidate]
    runs-on: ubuntu-latest
    # Reads the latest immutable release and downloads its exact asset for a
    # semantic comparison. Publication remains in the separate release job.
    permissions:
      contents: read # Reads immutable release metadata and the exact published asset.
      deployments: read # Reads durable downstream-delivery acknowledgements for recovery.
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
      semantic_changed: ${{ steps.check.outputs.semantic_changed }}
      resume_publication: ${{ steps.check.outputs.resume_publication }}
      version: ${{ steps.check.outputs.release_version }}
      release_asset: ${{ steps.check.outputs.release_asset }}
      semantic_digest: ${{ steps.check.outputs.semantic_digest }}
      release_commit: ${{ steps.check.outputs.release_commit }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked environment
        run: |
          uv sync --frozen

      - name: Download candidate one
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-candidate-one
          path: release/candidate-one/

      - name: Download candidate two
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-candidate-two
          path: release/candidate-two/

      - name: Compare independent release candidates
        env:
          VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          sha256sum \
            "release/candidate-one/api-specs-v${VERSION}.zip" \
            "release/candidate-two/api-specs-v${VERSION}.zip"
          cmp \
            "release/candidate-one/api-specs-v${VERSION}.zip" \
            "release/candidate-two/api-specs-v${VERSION}.zip"
          mv "release/candidate-one/api-specs-v${VERSION}.zip" release/

      - name: Compare semantic release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          uv run --frozen python -m scripts.semantic_release compare \
            --current-archive "release/api-specs-v${VERSION}.zip" \
            --candidate-version "${VERSION}" \
            --source-commit "${GITHUB_SHA}" \
            --repository "${GITHUB_REPOSITORY}" \
            --output reports/semantic-release-decision.json \
            --github-output "${GITHUB_OUTPUT}" \
            --recovery-directory release

      - name: Upload semantic release decision
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semantic-release-decision
          path: reports/semantic-release-decision.json
          retention-days: 30

      - name: Upload release candidate
        if: steps.check.outputs.should_publish == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate
          path: release/${{ steps.check.outputs.release_asset }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create Release
    needs: [validate, check-release-needed]
    if: needs.check-release-needed.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Creates the exact tag and immutable GitHub release asset.
    outputs:
      release_receipt: ${{ steps.verify_release.outputs.release_receipt }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked environment
        run: |
          uv sync --frozen

      - name: Download release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-candidate
          path: release/

      - name: Download semantic release decision
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: semantic-release-decision
          path: reports/

      - name: Generate release notes
        if: needs.check-release-needed.outputs.semantic_changed == 'true'
        id: release_notes
        env:
          VERSION: ${{ needs.check-release-needed.outputs.version }}
          SPECS_ETAG: ${{ needs.validate.outputs.specs_etag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          uv run --frozen python -m scripts.semantic_release notes \
            --decision reports/semantic-release-decision.json \
            --version "${VERSION}" \
            --specs-etag "${SPECS_ETAG}" \
            --repository "${REPOSITORY}" \
            --output release_notes.md
          cat release_notes.md

      - name: Require immutable releases setting
        env:
          # The repository setting is an Administration endpoint. The
          # workflow GITHUB_TOKEN has no Administration permission, while
          # REPO_SETTINGS_TOKEN exists specifically for governed settings.
          GH_TOKEN: ${{ secrets.REPO_SETTINGS_TOKEN }}
        run: |
          gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/immutable-releases" \
            --jq '.enabled == true' | grep -qx true

      - name: Create GitHub Release
        if: needs.check-release-needed.outputs.semantic_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check-release-needed.outputs.version }}
        run: |
          gh release create \
            "v${VERSION}" \
            "release/api-specs-v${VERSION}.zip" \
            --target "${GITHUB_SHA}" \
            --title "F5 XC API Specs v${VERSION}" \
            --notes-file release_notes.md

      - name: Verify immutable GitHub release
        id: verify_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check-release-needed.outputs.version }}
          RELEASE_COMMIT: ${{ needs.check-release-needed.outputs.release_commit }}
        run: |
          uv run --frozen python -m scripts.verify_release \
            --repository "${GITHUB_REPOSITORY}" \
            --tag "v${VERSION}" \
            --expected-asset "api-specs-v${VERSION}.zip" \
            --local-asset "release/api-specs-v${VERSION}.zip" \
            --expected-commit "${RELEASE_COMMIT}" \
            --receipt-output "$RUNNER_TEMP/api-specs-release-receipt.json" \
            --install-dir "$RUNNER_TEMP/api-specs-install-uat"

          attestation_verified=false
          for attempt in 1 2 3 4 5 6; do
            if gh release verify "v${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null && \
              gh release verify-asset "v${VERSION}" \
                "release/api-specs-v${VERSION}.zip" \
                --repo "${GITHUB_REPOSITORY}" >/dev/null; then
              attestation_verified=true
              break
            fi
            if [ "$attempt" -lt 6 ]; then
              sleep 5
            fi
          done
          if [ "$attestation_verified" != true ]; then
            echo "::error::GitHub release attestation did not verify"
            exit 1
          fi
          receipt=$(jq -ce '.' "$RUNNER_TEMP/api-specs-release-receipt.json")
          echo "release_receipt=$receipt" >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          VERSION: ${{ needs.check-release-needed.outputs.version }}
          SEMANTIC_DIGEST: ${{ needs.check-release-needed.outputs.semantic_digest }}
          RESUMED: ${{ needs.check-release-needed.outputs.resume_publication }}
        run: |
          {
            echo "### Release Verified 🎉"
            echo ""
            echo "**Version**: v${VERSION}"
            echo "**Semantic Digest**: ${SEMANTIC_DIGEST}"
            echo "**Recovered Publication**: ${RESUMED}"
          } >> "${GITHUB_STEP_SUMMARY}"

  notify-downstream:
    name: Notify api-specs-enriched
    needs: [check-release-needed, release]
    # Fire only on a release that published and passed the immutable release
    # verification. `release` is skipped
    # whenever `check-release-needed` says there is nothing to publish, and it
    # fails if `gh release create` fails; `== 'success'` is false in both
    # cases, so a skipped or failed release never dispatches. This job is
    # deliberately separate from `release` rather than a step inside it, so
    # release publication and downstream delivery have separate permissions.
    if: needs.release.result == 'success'
    runs-on: ubuntu-latest
    # The cross-repo dispatch authenticates with a PAT because a repository's
    # own GITHUB_TOKEN cannot dispatch elsewhere. GITHUB_TOKEN writes only the
    # exact-receipt deployment acknowledgement in this source repository.
    permissions:
      contents: read # Checks out the receipt validation and acknowledgement scripts.
      deployments: write # Records the exact downstream-delivery receipt acknowledgement.

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked environment
        run: |
          uv sync --frozen

      - name: Dispatch upstream-specs-released to api-specs-enriched
        env:
          # POST /repos/{owner}/{repo}/dispatches needs Contents: write on the
          # target and nothing else. REPO_SYNC_TOKEN is the fine-grained fleet
          # PAT holding Contents R/W, Issues R/W, Pull Requests R/W and
          # Metadata Read -- the narrowest secret this repository already
          # carries that can do this. Deliberately NOT REPO_ADMIN_TOKEN, whose
          # administration rights would turn a leak of this step into a
          # repository takeover rather than a write. REPO_SETTINGS_TOKEN is not
          # a candidate either: Administration R/W but Contents *Read* only, so
          # it is broader in the wrong axis and insufficient in the right one.
          GH_TOKEN: ${{ secrets.REPO_SYNC_TOKEN }}
          VERSION: ${{ needs.check-release-needed.outputs.version }}
          SOURCE_REPO: ${{ github.repository }}
          RELEASE_RECEIPT: ${{ needs.release.outputs.release_receipt }}
        run: |
          # Plain `gh api` rather than a third-party action. A
          # repository_dispatch is a single API call, so depending on an
          # external action would hand a privileged token to code sitting
          # behind a mutable tag -- and `zizmor.yaml` disables `unpinned-uses`,
          # so nothing here would flag it. `gh` is preinstalled on
          # GitHub-hosted runners, so this removes a dependency rather than
          # trading one for another.
          #
          # Every value crosses into the shell through env: above and is
          # referenced as a quoted variable; nothing is interpolated into this
          # body.
          jq -nce \
            --arg source "$SOURCE_REPO" \
            --argjson receipt "$RELEASE_RECEIPT" '
              if ($receipt | keys | sort) !=
                  (["asset_digest", "asset_name", "asset_size", "published_at", "tag_name", "version"] | sort)
              then error("verified release receipt has an unexpected shape")
              else {
                event_type: "upstream-specs-released",
                client_payload: {
                  trigger_source: $source,
                  release_receipt: $receipt
                }
              }
              end
            ' > "$RUNNER_TEMP/downstream-dispatch.json"
          gh api --method POST "repos/f5-sales-demo/api-specs-enriched/dispatches" \
            --input "$RUNNER_TEMP/downstream-dispatch.json"

      - name: Record exact downstream delivery acknowledgement
        env:
          ACK_TOKEN: ${{ github.token }}
          RELEASE_RECEIPT: ${{ needs.release.outputs.release_receipt }}
          RELEASE_COMMIT: ${{ needs.check-release-needed.outputs.release_commit }}
        run: |
          uv run --frozen python -m scripts.dispatch_ack record \
            --repository "${GITHUB_REPOSITORY}" \
            --commit "${RELEASE_COMMIT}" \
            --receipt-json "${RELEASE_RECEIPT}"

      - name: Summary
        env:
          VERSION: ${{ needs.check-release-needed.outputs.version }}
        run: |
          echo "::notice::Dispatched 'upstream-specs-released' (v${VERSION}) to f5-sales-demo/api-specs-enriched"
          {
            echo "### Downstream Notified 📣"
            echo ""
            echo "**Event**: \`upstream-specs-released\`"
            echo "**Target**: \`f5-sales-demo/api-specs-enriched\`"
            echo "**Version**: v${VERSION}"
          } >> "${GITHUB_STEP_SUMMARY}"

  skip-release:
    name: Skip Release (No Changes)
    needs: [validate, check-release-needed]
    if: needs.check-release-needed.outputs.should_publish == 'false'
    runs-on: ubuntu-latest
    # Writes only to the step summary.
    permissions:
      contents: read

    steps:
      - name: Summary
        env:
          SPECS_CHANGED: ${{ needs.validate.outputs.specs_changed }}
          SEMANTIC_DIGEST: ${{ needs.check-release-needed.outputs.semantic_digest }}
        run: |
          {
            echo "### No Release Needed ⏭️"
            echo ""
            echo "No changes detected in upstream specs or generated output."
            echo ""
            echo "**Specs Changed**: ${SPECS_CHANGED}"
            echo "**Semantic Digest**: ${SEMANTIC_DIGEST}"
          } >> "${GITHUB_STEP_SUMMARY}"

  failure-tracker:
    name: Producer Release Failure Tracker
    needs:
      - validate
      - release-metadata
      - build-release-candidate
      - check-release-needed
      - release
      - notify-downstream
      - skip-release
      - commit-release-specs
    # Runs on success too, so the tracker it opens is also the thing that
    # closes it. Producer jobs skipped by their measured release decision are
    # healthy; failed or cancelled producer jobs are not. Documentation is
    # deliberately outside this producer/release tracker and has independent
    # ownership.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    # Opens, updates or closes the single pipeline-failure tracking issue.
    permissions:
      contents: read # Retains the workflow's read-only repository baseline.
      issues: write # Creates, updates, and closes the producer failure tracker.

    steps:
      - name: Reconcile the failure tracker with this run
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PIPELINE_UNHEALTHY: >-
            ${{ contains(needs.*.result, 'failure') ||
                contains(needs.*.result, 'cancelled') }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          METADATA_RESULT: ${{ needs.release-metadata.result }}
          BUILD_RESULT: ${{ needs.build-release-candidate.result }}
          CHECK_RESULT: ${{ needs.check-release-needed.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          NOTIFY_RESULT: ${{ needs.notify-downstream.result }}
          SKIP_RESULT: ${{ needs.skip-release.result }}
          PUBLISH_SPECS_RESULT: ${{ needs.commit-release-specs.result }}
        with:
          script: |
            // One tracker, not one issue per run. The previous version opened
            // a dated issue on every failure: thirteen consecutive runs
            // produced thirteen near-identical issues, none of which named a
            // cause, so a two-week outage read as routine noise. A single
            // issue that accumulates occurrences -- and closes itself when a
            // run succeeds -- is the signal.
            const marker = '<!-- validate-and-release-producer-failure-tracker -->';
            const failed = process.env.PIPELINE_UNHEALTHY === 'true';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/` +
              `${context.repo.repo}/actions/runs/${context.runId}`;

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'automation',
              per_page: 100,
            });
            const tracker = open.find((issue) => (issue.body || '').includes(marker));
            if (!failed) {
              if (tracker) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: tracker.number,
                  body: `Recovered: ${runUrl}`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: tracker.number,
                  state: 'closed',
                  state_reason: 'completed',
                });
                core.notice(`Pipeline recovered; closed #${tracker.number}`);
              }
              return;
            }

            const occurrence = [
              `**Run**: ${runUrl}`,
              `**Trigger**: ${context.eventName}`,
              `**Date**: ${new Date().toISOString().split('T')[0]}`,
              '',
              '| Job | Result |',
              '| --- | --- |',
              `| Validate | ${process.env.VALIDATE_RESULT} |`,
              `| Release Metadata | ${process.env.METADATA_RESULT} |`,
              `| Independent Builds | ${process.env.BUILD_RESULT} |`,
              `| Check Release | ${process.env.CHECK_RESULT} |`,
              `| Release | ${process.env.RELEASE_RESULT} |`,
              `| Notify Downstream | ${process.env.NOTIFY_RESULT} |`,
              `| Skip Release | ${process.env.SKIP_RESULT} |`,
              `| Publish Regenerated Specs | ${process.env.PUBLISH_SPECS_RESULT} |`,
              '',
              'The failing step names the cause in its own log; the full',
              'Spectral gate report is in the `validation-reports` artifact.',
            ].join('\n');

            if (tracker) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: tracker.number,
                body: `Still failing.\n\n${occurrence}`,
              });
              core.notice(`Still failing; see #${tracker.number}`);
              return;
            }

            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Producer release pipeline is unhealthy',
              body: [
                marker,
                '## Producer release pipeline is unhealthy',
                '',
                'Publication and delivery state are remeasured from immutable',
                'release evidence and exact delivery acknowledgement. This issue collects each',
                'further occurrence and closes itself when a run succeeds.',
                '',
                occurrence,
              ].join('\n'),
              labels: ['automation', 'bug'],
            });
            core.notice(`Producer pipeline unhealthy; opened #${created.data.number}`);

  update-docs:
    name: Update Documentation
    needs: [validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Pushes the generated documentation branch.
      pull-requests: write # Opens and enables auto-merge for the generated documentation PR.

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.REPO_ADMIN_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Download validation reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: validation-reports
          path: reports/

      - name: Generate documentation
        run: |
          python scripts/generate_docs.py \
            --validation-report reports/validation_report.json \
            --fix-report reports/fixes_applied.json \
            --output docs/01-validation-report.mdx

      - name: Commit and PR if changed
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No docs changes"
            exit 0
          fi
          # One stable branch, force-updated, rather than a new timestamped branch per run.
          #
          # The old `docs/update-validation-report-$(date +%s)` orphaned any run whose PR was
          # wedged on a transient check: the next run opened a different PR on a different
          # branch and nothing ever revisited the stuck one. Twelve accumulated between
          # 2026-06-12 and 2026-07-05 (#723). With a fixed branch a wedged run is repaired by
          # the next one instead of abandoned, and at most one report PR is ever open.
          #
          # Same shape as docs-control's sync-managed-files, which uses the fixed
          # `governance/sync-managed-files` branch for exactly this reason.
          #
          # The name still starts with `docs/update-`, which both gates require: it is in
          # docs-control's EXCLUDE_BRANCHES for require-linked-issue, and in both branch lists
          # in code-review.yml.
          BRANCH="docs/update-validation-report"
          # -B, not -b: the branch may already exist locally on a re-run, and -b would abort.
          git checkout -B "${BRANCH}"
          git commit -m "docs: update validation report"
          git push --force origin "${BRANCH}"

          # Reuse the open PR if there is one; --force above has already updated its head.
          if [ -z "$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[].number')" ]; then
            gh pr create --title "docs: update validation report" \
              --body "Auto-generated from validation pipeline run." \
              --head "${BRANCH}"
          else
            echo "Refreshed the existing PR for ${BRANCH}."
          fi
          gh pr merge --auto --squash "${BRANCH}"

  commit-release-specs:
    name: Publish Regenerated Specs
    needs: [validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Pushes the regenerated specification artifact branch.
      pull-requests: write # Opens and enables auto-merge for the artifact publication PR.

    # The other half of #681. A human PR carries its own regeneration (the drift gate in
    # tests.yml enforces that), which covers corrections. It cannot cover the case where F5
    # publishes a new drop: new, renumbered or deleted specs arrive with no PR behind them.
    # This job absorbs those.

    steps:
      # REPO_SYNC_TOKEN, deliberately not REPO_ADMIN_TOKEN, for the reason already documented
      # on the downstream-dispatch step above: it is the narrowest secret this repository
      # carries that can push and open a PR, and admin rights would turn a leak of this step
      # into a repository takeover. GITHUB_TOKEN is not a candidate either -- pushes made with
      # it do not trigger pull_request workflows, so tests.yml would never run on the PR.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.REPO_SYNC_TOKEN }}

      - name: Fail fast if the sync token is absent
        env:
          SYNC_TOKEN: ${{ secrets.REPO_SYNC_TOKEN }}
        run: |
          if [ -z "${SYNC_TOKEN}" ]; then
            echo "::error::REPO_SYNC_TOKEN is not set. Refusing to fall back to a broader" \
                 "token or to GITHUB_TOKEN, which would not trigger tests.yml on the PR."
            exit 1
          fi

      # Recreate rather than overlay. Upstream filenames embed a sequence index that shifts
      # when F5 adds or removes a domain, so specs the current run does not write would
      # otherwise survive and be republished. The release job does the same, for the same
      # reason.
      - name: Reset the artifact directory
        run: |
          rm -rf release/specs
          mkdir -p release/specs

      - name: Download reconciled specs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: reconciled-specs
          path: release/specs/

      # A separate artifact because `reconciled-specs` is uploaded without
      # `include-hidden-files`, so the dot-prefixed provenance record is absent from it. The
      # artifact must carry it: the drift gate reads spec_date from here to pin info.version.
      - name: Download spec metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: spec-metadata
          path: release/specs/

      - name: Open a PR if the published specs changed
        env:
          GH_TOKEN: ${{ secrets.REPO_SYNC_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # -A so deletions are staged; a removed upstream domain must leave the artifact.
          git add -A release/specs

          # Only the specs decide whether to publish. .spec_metadata.json carries
          # download_date and a microsecond download_timestamp that every non-304 download
          # rewrites, so keying off the whole directory would open a timestamp-only PR every
          # single day.
          if git diff --cached --quiet -- 'release/specs/*.json'; then
            echo "No spec changes; discarding any metadata-only churn."
            git reset --quiet
            git checkout -- release/specs || true
            exit 0
          fi

          # sync/ clears both gates without a governance change: it is in docs-control's
          # EXCLUDE_BRANCHES for require-linked-issue, and in both branch lists in
          # code-review.yml. Prefixes like governance/ are in the latter but not the former
          # and would deadlock.
          BRANCH="sync/regenerate-release-specs-$(date +%s)"
          git checkout -b "${BRANCH}"
          git commit -m "chore: publish regenerated release/specs"
          git push origin "${BRANCH}"

          gh pr create \
            --title "chore: publish regenerated release/specs" \
            --body "Auto-generated: the pipeline produced a \`release/specs\` that differs from the committed artifact. See #681." \
            --head "${BRANCH}"
          gh pr merge --auto --squash
